<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sizing and Spacing</title>

    <!-- tailwindCSS PlayCDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h1 class="text-4xl text-blue-600 text-center m-5 italic underline">
      TailwindCSS Height, width, margin and Padding
    </h1>
    <h2 class="text-3xl text-fuchsia-600 text-center m-5 italic underline">
      Min and max height and width
    </h2>
    <p class="text-2xl text-fuchsia-600 text-center m-5 underline">
      min-width, max-width, min-height, max-height মূলত কোনো element-এর size-এর
      সীমা (boundary) ঠিক করার জন্য ব্যবহার হয়।
    </p>
    <p
      class="text-xl text-fuchsia-600 mt-5 italic underline font-semibold mx-10"
    >
      সহজভাবে মনে রাখুন:
    </p>
    <ul class="text-xl text-indigo-600 mt-3 mx-10">
      <li>min = এর চেয়ে ছোট হতে পারবে না</li>
      <li>max = এর চেয়ে বড় হতে পারবে না</li>
    </ul>
  </body>
</html>
