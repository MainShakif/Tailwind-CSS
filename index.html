<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tailwind CSS</title>

    <!-- *tailwindCSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h1 class="text-green-600 font-medium text-4xl">Hello Tailwind CSS!!!</h1>

    <!-- just explore with chatgpt -->
    <div class="w-72 m-20 overflow-hidden rounded-xl bg-white shadow-lg">
      <!-- Product Image -->
      <img
        src="./watch-card.jpg"
        alt="Product"
        class="h-48 w-full object-cover"
      />

      <!-- Product Info -->
      <div class="p-5">
        <h2 class="mb-2 text-xl font-bold text-gray-800">Sports watch</h2>

        <p class="mb-4 text-sm text-gray-500">
          High-quality watch with a multifunctional display.
        </p>

        <!-- Price & Rating -->
        <div class="mb-4 flex items-center justify-between">
          <span class="text-2xl font-bold text-green-600"> $49.99 </span>

          <span class="text-sm text-yellow-500"> ★ 4.8 </span>
        </div>

        <!-- Button -->
        <button
          class="w-full rounded-lg bg-blue-600 py-2.5 font-semibold text-white transition hover:bg-blue-700"
        >
          Add to Cart
        </button>
      </div>
    </div>
  </body>
</html>
