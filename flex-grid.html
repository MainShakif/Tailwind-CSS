<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flex- Grid</title>

    <!-- *tailwindCSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h2 class="text-[50px] font-bold text-blue-500 underline italic">
      Layout Making using Grid
    </h2>
    <!--parent card container-->
    <section class="mx-10 my-6 grid md:grid-cols-2 xl:grid-cols-4 gap-4">
      <!-- *child 1-->
      <h2
        class="w-full h-50 text-cyan-00 text-2xl font-bold border-2 p-7.65 border-amber-400 rounded-2xl flex justify-center items-center"
      ></h2>

      <!-- *child 2-->
      <h2
        class="w-full h-50 text-cyan-00 text-2xl font-bold border-2 p-7.65 border-amber-400 rounded-2xl flex justify-center items-center"
      ></h2>

      <!-- *child 3-->
      <h2
        class="w-full h-50 text-cyan-00 text-2xl font-bold border-2 p-7.65 border-amber-400 rounded-2xl flex justify-center items-center"
      ></h2>

      <!-- *child 4-->
      <h2
        class="w-full h-50 text-cyan-00 text-2xl font-bold border-2 p-7.65 border-amber-400 rounded-2xl flex justify-center items-center"
      ></h2>
    </section>

    <br />
    <br />

    <h2 class="text-[50px] font-bold text-blue-500 underline italic">
      Layout Making using flexbox
    </h2>
    <!--parent card container -->
    <section class="mx-10 flex flex-col md:flex-row gap-4 my-5">
      <!-- *child 1-->
      <h2
        class="w-full h-100 text-cyan-00 text-2xl font-bold border-2 p-7.65 border-amber-400 rounded-2xl flex justify-center items-center"
      ></h2>

      <!-- *child 2-->
      <h2
        class="w-full h-100 text-cyan-00 text-2xl font-bold border-2 p-7.65 border-amber-400 rounded-2xl flex justify-center items-center"
      ></h2>

      <!-- *child 3-->
      <h2
        class="w-full h-100 text-cyan-00 text-2xl font-bold border-2 p-7.65 border-amber-400 rounded-2xl flex justify-center items-center"
      ></h2>

      <!-- *child 4 -->
      <h2
        class="w-full h-100 text-cyan-00 text-2xl font-bold border-2 p-7.65 border-amber-400 rounded-2xl flex justify-center items-center"
      ></h2>
    </section>
  </body>
</html>
